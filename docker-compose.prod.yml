# Prod (Hetzner). Run with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Path-based routing on a single domain (DOMAIN_APP):
#   /api/*  -> api service
#   /*      -> web service
# Postgres + Redis are NOT in this compose; api/worker connect to pre-existing
# `pg18` + `redis7` containers via the external `davinci_net` network.

networks:
  davinci_net:
    external: true
    name: davinci_net

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN_APP: ${DOMAIN_APP}
      ACME_EMAIL: ${TRAEFIK_ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    networks: [davinci_net]
