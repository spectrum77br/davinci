# Prod (Hetzner). Run with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Path-based routing on a single domain (DOMAIN_APP):
#   /api/*  -> api service
#   /*      -> web service
# Postgres + Redis are NOT in this compose; api/worker connect to pre-existing
# `pg18` + `redis7` containers via the external `davinci_net` network.

networks:
  davinci_net:
    external: true
    name: davinci_net
  # Rede de borda compartilhada com OUTROS projetos (invoicer/67why). Externa:
  # criada fora deste compose; o caddy entra nela p/ alcançar invoicer-app.
  web_edge:
    external: true
    name: web_edge

services:
  # Magalu-only egress through the owner's Mac. No public port: the TCP bridge
  # reaches a private Unix socket forwarded by SSH to the authenticated Mac proxy.
  magalu_proxy:
    build:
      context: ./infra/magalu-proxy
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./data/magalu-proxy:/tunnel:ro
    networks: [davinci_net]
    healthcheck:
      # A 407 proves the bridge, SSH tunnel and Mac proxy are reachable. The
      # unauthenticated request is rejected before any connection to Magalu.
      test:
        - CMD
        - python
        - -c
        - >-
          import socket;
          s=socket.create_connection(('127.0.0.1',13129),5);
          s.settimeout(5);
          s.sendall(b'CONNECT api.magalu.com:443 HTTP/1.1\r\nHost: api.magalu.com:443\r\n\r\n');
          stream=s.makefile('rb');
          status=stream.readline(256);
          stream.close();
          s.close();
          assert b' 407 ' in status
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN_APP: ${DOMAIN_APP}
      ACME_EMAIL: ${TRAEFIK_ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Sites de outros projetos (no host, fora do repo). Ver `import` no Caddyfile.
      - /opt/edge/caddy-sites:/etc/caddy/sites-enabled:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    networks: [davinci_net, web_edge]
