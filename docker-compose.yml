name: davinci

networks:
  davinci_net:
    driver: bridge
  # IP da loja no celular (docs/ip-celular.md): rede SÓ do intermediário e do
  # Redis próprio do recurso. O intermediário fica exposto na internet e não
  # pode alcançar o Redis principal (sem senha, com os jobs dos workers) nem
  # o resto da davinci_net. Ponte comum: a saída para a internet (proxies das
  # empresas) continua.
  ipcel_net:
    driver: bridge

services:
  # Local-only DB/Redis. In prod, api/worker connect to pre-existing pg18 + redis7
  # containers via the external `davinci_net` network (see docker-compose.prod.yml).
  postgres:
    image: postgres:18-alpine
    profiles: [local]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-davinci}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-davinci}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-davinci} -d ${POSTGRES_DB:-davinci}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [davinci_net]

  redis:
    image: redis:7-alpine
    profiles: [local]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [davinci_net]

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    # APP_NAME → asyncpg server_settings.application_name → audit
    # triggers (migration 0135) e pg_stat_activity. Cada processo
    # abaixo recebe um nome diferente pra identificar quem escreve sem
    # precisar rastrear PID.
    environment:
      APP_NAME: davinci-api
      # IP da loja no celular: o Redis próprio do recurso (ver ipcel_redis).
      IPCEL_REDIS_URL: redis://ipcel_redis:6379/0
    volumes:
      - ./data/uploads:/data/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      davinci_net:
        aliases:
          - api

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["uv", "run", "arq", "app.worker.WorkerSettings"]
    env_file: .env
    environment:
      APP_NAME: davinci-worker
    volumes:
      - ./data/uploads:/data/uploads
    networks:
      davinci_net:
        aliases:
          - worker

  # Worker dedicado pra jobs disparados pela UI (criar kit, enviar
  # produto pro Bling). Roda em paralelo ao `worker` (fila default) —
  # webhooks de marketplace não bloqueiam clicks do operador.
  # Mesma imagem, comando diferente: WorkerSettingsUI usa
  # queue_name=davinci_ui, max_jobs=5, job_timeout=60s.
  worker_ui:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["uv", "run", "arq", "app.worker.WorkerSettingsUI"]
    env_file: .env
    environment:
      APP_NAME: davinci-worker-ui
    volumes:
      - ./data/uploads:/data/uploads
    networks:
      davinci_net:
        aliases:
          - worker_ui

  # Worker dedicado pro cron `check_marketplace_shipped_orders` (a cada
  # 5 min). Antes rodava no default e disputava com webhooks marketplace
  # em pico (100+/min), atrasando o tick 15-20 min. Fila `davinci_marketplace`
  # garante execução cravada.
  worker_marketplace:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["uv", "run", "arq", "app.worker.WorkerSettingsMarketplace"]
    env_file: .env
    environment:
      APP_NAME: davinci-worker-marketplace
    volumes:
      - ./data/uploads:/data/uploads
    networks:
      davinci_net:
        aliases:
          - worker_marketplace

  # Worker dedicado pro financeiro real por pedido
  # (`sync_marketplace_financials_for_order_run`, fila `davinci_financials`).
  # Isola o financeiro (lento, rate-limited por Shopee/ML) do `ingest_bling_
  # order_run` da fila default — antes dividiam o mesmo worker e em pico o
  # financeiro afogava o ingest, estourando o backlog (29/06: ~15k jobs / 17h).
  # Mesma imagem, comando diferente: WorkerSettingsFinancials, max_jobs=8.
  worker_financials:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["uv", "run", "arq", "app.worker.WorkerSettingsFinancials"]
    env_file: .env
    environment:
      APP_NAME: davinci-worker-financials
    volumes:
      - ./data/uploads:/data/uploads
    networks:
      davinci_net:
        aliases:
          - worker_financials

  # Worker dedicado pro SYNC EM MASSA (fila `davinci_sync`): sync_all_run
  # (Sincronizar Todos, ~30 min), auto_link_run (Vincular Automático),
  # sync_product_run (webhook de produto) e refresh_bling_stock_run. Antes
  # disputavam a fila default com o ingest de pedido e ~25 crons; um massa
  # segurava o slot e uma conta lenta travava a barra. Mesma imagem, comando
  # diferente: WorkerSettingsSync, max_jobs=8.
  worker_sync:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["uv", "run", "arq", "app.worker.WorkerSettingsSync"]
    env_file: .env
    environment:
      APP_NAME: davinci-worker-sync
    volumes:
      - ./data/uploads:/data/uploads
    networks:
      davinci_net:
        aliases:
          - worker_sync

  # Executor cloud dos comandos de Ads 'api' (ML/Amazon): roda só
  # `marketing_consume_commands` (classe WorkerSettingsMarketingApi), drenando a
  # outbox marketing_commands e aplicando pause/resume/orçamento na API do ML —
  # que funciona da nuvem (a de Ads da Shopee é bloqueada → usa a marionete
  # externa via /agent/lease). MARKETING_AGENT_NODE=true liga o consumidor e
  # DEVE existir em UM único nó, senão dois processos disputam a mesma outbox.
  worker_marketing_agent:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["uv", "run", "arq", "app.worker.WorkerSettingsMarketingApi"]
    env_file: .env
    environment:
      APP_NAME: davinci-worker-marketing-agent
      MARKETING_AGENT_NODE: "true"
    volumes:
      - ./data/uploads:/data/uploads
    networks:
      davinci_net:
        aliases:
          - worker_marketing_agent

  # IP da loja no celular (16/11/2026, docs/ip-celular.md): Redis PRÓPRIO do
  # recurso. Sem disco (os links duram no máximo 4 h; se cair, os links somem
  # e o intermediário recusa tudo — falha fechada) e por isso sem MISCONF com
  # o disco cheio. A api fala com ele pela davinci_net; o intermediário, pela
  # ipcel_net — e só com ele.
  ipcel_redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 32mb
      - --maxmemory-policy
      - noeviction
      - --protected-mode
      - "no"
    user: redis
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [davinci_net, ipcel_net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # IP da loja no celular (16/11/2026, docs/ip-celular.md): intermediário
  # SOCKS5 entre o iPhone e o proxy da empresa. Mesma imagem da api (não gasta
  # disco), mas SEM o .env: fica exposto na internet, então recebe só o Redis
  # PRÓPRIO do recurso e a chave própria (IPCEL_RELAY_KEY, a mesma do .env da
  # api). Só na ipcel_net (não alcança o Redis principal, o banco nem a api) e
  # sem root. Sem a chave ele não escuta nada (recurso desligado). A porta
  # pública só é publicada no docker-compose.prod.yml.
  ipcel_relay:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    # python direto (não `uv run`): o ambiente já está em /usr/local e o uv
    # poderia tentar baixar pacotes ao subir.
    command: ["python", "-m", "app.ip_celular.relay"]
    environment:
      IPCEL_REDIS_URL: redis://ipcel_redis:6379/0
      IPCEL_RELAY_KEY: ${IPCEL_RELAY_KEY:-}
      IPCEL_BLOQUEAR: ${IPCEL_BLOQUEAR:-}
      IPCEL_PORTA: "21080"
    depends_on: [ipcel_redis]
    # nobody: invadido, não é root nem dentro do contêiner.
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    # Uma linha por conexão: com o disco apertado, o log gira sozinho.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [ipcel_net]
    healthcheck:
      # Só o cumprimento SOCKS5 (pede usuário/senha): não autentica nada.
      test:
        - CMD
        - python
        - -c
        - >-
          import socket;
          s=socket.create_connection(('127.0.0.1',21080),5);
          s.settimeout(5);
          s.sendall(bytes([5,1,2]));
          assert s.recv(2)==bytes([5,2])
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Sidecar MEGAcmd: ponte com a conta MEGA (fotos dos produtos da Tabela
  # de Preços). A API fala com ele em http://megacmd:9000 (rede interna,
  # sem porta no host); a sessão de login persiste no volume. Como a
  # davinci_net é compartilhada, os endpoints exigem MEGA_SIDECAR_TOKEN
  # (mesmo valor no .env, lido também pela api).
  megacmd:
    build:
      context: ./infra/megacmd
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MEGA_SIDECAR_TOKEN: ${MEGA_SIDECAR_TOKEN:-}
      PREVIAS_DIR: /srv/previas
    volumes:
      - ./data/megacmd:/root/.megaCmd
      # Cache das miniaturas/prévias do painel de mídias (JPEG de 320 e 1600
      # px; ~200 MB para o acervo de set/2026) e dos vídeos convertidos para
      # o visor (MP4 de até 1280 px: ~10% do original, ~300 MB para os 2,9 GB
      # de set/2026). Volume próprio para não misturar com a sessão do MEGA e
      # sobreviver ao rebuild.
      - ./data/megacmd_previas:/srv/previas
    networks:
      davinci_net:
        aliases:
          - megacmd

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      - api
    networks:
      davinci_net:
        aliases:
          - web
