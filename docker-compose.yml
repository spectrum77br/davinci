name: davinci

networks:
  davinci_net:
    driver: bridge

services:
  # Local-only DB/Redis. In prod, api/worker connect to pre-existing pg18 + redis7
  # containers via the external `davinci_net` network (see docker-compose.prod.yml).
  postgres:
    image: postgres:18-alpine
    profiles: [local]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-davinci}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-davinci}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-davinci} -d ${POSTGRES_DB:-davinci}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [davinci_net]

  redis:
    image: redis:7-alpine
    profiles: [local]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [davinci_net]

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    # APP_NAME → asyncpg server_settings.application_name → audit
    # triggers (migration 0135) e pg_stat_activity. Cada processo
    # abaixo recebe um nome diferente pra identificar quem escreve sem
    # precisar rastrear PID.
    environment:
      APP_NAME: davinci-api
    volumes:
      - ./data/uploads:/data/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      davinci_net:
        aliases:
          - api

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["uv", "run", "arq", "app.worker.WorkerSettings"]
    env_file: .env
    environment:
      APP_NAME: davinci-worker
    volumes:
      - ./data/uploads:/data/uploads
    networks:
      davinci_net:
        aliases:
          - worker

  # Worker dedicado pra jobs disparados pela UI (criar kit, enviar
  # produto pro Bling). Roda em paralelo ao `worker` (fila default) —
  # webhooks de marketplace não bloqueiam clicks do operador.
  # Mesma imagem, comando diferente: WorkerSettingsUI usa
  # queue_name=davinci_ui, max_jobs=5, job_timeout=60s.
  worker_ui:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["uv", "run", "arq", "app.worker.WorkerSettingsUI"]
    env_file: .env
    environment:
      APP_NAME: davinci-worker-ui
    volumes:
      - ./data/uploads:/data/uploads
    networks:
      davinci_net:
        aliases:
          - worker_ui

  # Worker dedicado pro cron `check_marketplace_shipped_orders` (a cada
  # 5 min). Antes rodava no default e disputava com webhooks marketplace
  # em pico (100+/min), atrasando o tick 15-20 min. Fila `davinci_marketplace`
  # garante execução cravada.
  worker_marketplace:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["uv", "run", "arq", "app.worker.WorkerSettingsMarketplace"]
    env_file: .env
    environment:
      APP_NAME: davinci-worker-marketplace
    volumes:
      - ./data/uploads:/data/uploads
    networks:
      davinci_net:
        aliases:
          - worker_marketplace

  # Worker dedicado pro financeiro real por pedido
  # (`sync_marketplace_financials_for_order_run`, fila `davinci_financials`).
  # Isola o financeiro (lento, rate-limited por Shopee/ML) do `ingest_bling_
  # order_run` da fila default — antes dividiam o mesmo worker e em pico o
  # financeiro afogava o ingest, estourando o backlog (29/06: ~15k jobs / 17h).
  # Mesma imagem, comando diferente: WorkerSettingsFinancials, max_jobs=8.
  worker_financials:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["uv", "run", "arq", "app.worker.WorkerSettingsFinancials"]
    env_file: .env
    environment:
      APP_NAME: davinci-worker-financials
    volumes:
      - ./data/uploads:/data/uploads
    networks:
      davinci_net:
        aliases:
          - worker_financials

  # Worker dedicado pro SYNC EM MASSA (fila `davinci_sync`): sync_all_run
  # (Sincronizar Todos, ~30 min), auto_link_run (Vincular Automático),
  # sync_product_run (webhook de produto) e refresh_bling_stock_run. Antes
  # disputavam a fila default com o ingest de pedido e ~25 crons; um massa
  # segurava o slot e uma conta lenta travava a barra. Mesma imagem, comando
  # diferente: WorkerSettingsSync, max_jobs=8.
  worker_sync:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["uv", "run", "arq", "app.worker.WorkerSettingsSync"]
    env_file: .env
    environment:
      APP_NAME: davinci-worker-sync
    volumes:
      - ./data/uploads:/data/uploads
    networks:
      davinci_net:
        aliases:
          - worker_sync

  # Executor cloud dos comandos de Ads 'api' (ML/Amazon): roda só
  # `marketing_consume_commands` (classe WorkerSettingsMarketingApi), drenando a
  # outbox marketing_commands e aplicando pause/resume/orçamento na API do ML —
  # que funciona da nuvem (a de Ads da Shopee é bloqueada → usa a marionete
  # externa via /agent/lease). MARKETING_AGENT_NODE=true liga o consumidor e
  # DEVE existir em UM único nó, senão dois processos disputam a mesma outbox.
  worker_marketing_agent:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["uv", "run", "arq", "app.worker.WorkerSettingsMarketingApi"]
    env_file: .env
    environment:
      APP_NAME: davinci-worker-marketing-agent
      MARKETING_AGENT_NODE: "true"
    volumes:
      - ./data/uploads:/data/uploads
    networks:
      davinci_net:
        aliases:
          - worker_marketing_agent

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      - api
    networks:
      davinci_net:
        aliases:
          - web
